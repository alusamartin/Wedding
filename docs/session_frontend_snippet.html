<!-- ===== INACTIVITY WARNING (include on every admin page) ===== -->
<div id="session-warning" class="alert alert-warning alert-dismissible fade"
     role="alert" style="display:none; position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:9999; max-width:90vw;">
  <strong>Still there?</strong> Your session expires in <span id="session-countdown">15</span> min due to inactivity.
  <button type="button" class="btn btn-sm btn-warning ml-2" onclick="sessionKeepAlive()">Keep me signed in</button>
  <button type="button" class="close" data-dismiss="alert"><span>&times;</span></button>
</div>

<script>
/**
 * WPMS Kenya — Session Keep-Alive (v2.1 hardened)
 * - Warns at 105 min (15 min before 120 min timeout)
 * - Auto-redirects to logout at 120 min
 * - "Keep me signed in" pings server to slide _last_activity
 * - Works offline? No — session is server-bound by design (M-Pesa culture needs server auth)
 */
(function() {
  const INACTIVITY_MS = 7200 * 1000; // 2h matches Session.php
  const WARN_AT_MS    = 6300 * 1000; // 105 min
  let warningShown = false;
  let lastActivity = Date.now();

  // Reset on user interaction (mobile-friendly: touch + scroll)
  ['click','keydown','touchstart','scroll'].forEach(ev =>
    document.addEventListener(ev, () => { lastActivity = Date.now(); if (warningShown) hideWarn(); }, {passive:true})
  );

  function showWarn() {
    const el = document.getElementById('session-warning');
    if (!el) return;
    el.style.display = 'block';
    el.classList.add('show');
    let mins = 15;
    const iv = setInterval(() => {
      mins -= 1;
      const c = document.getElementById('session-countdown');
      if (c) c.textContent = Math.max(0, mins);
      if (mins <= 0) clearInterval(iv);
    }, 60000);
    warningShown = true;
  }
  function hideWarn() {
    const el = document.getElementById('session-warning');
    if (!el) return;
    el.style.display = 'none';
    el.classList.remove('show');
    warningShown = false;
  }
  window.sessionKeepAlive = function() {
    fetch('ping.php', {method:'POST', credentials:'same-origin',
      headers:{'X-Requested-With':'fetch'}})
      .then(()=>{ lastActivity = Date.now(); hideWarn(); })
      .catch(()=> location.reload());
  };

  setInterval(() => {
    const idle = Date.now() - lastActivity;
    if (!warningShown && idle >= WARN_AT_MS) showWarn();
    if (idle >= INACTIVITY_MS) {
      // Server will also force logout; redirect to login with message
      location.href = 'logout.php?reason=timeout';
    }
  }, 60000); // check every minute (battery-friendly for phones)
})();
</script>
